global
  log stdout format raw local0
defaults
  mode http
  log global
  option httplog
  retries 0
  timeout connect 5s
  timeout client 35s
  timeout server 35s
frontend poc
  bind *:8080
  default_backend apache
backend apache
  balance roundrobin
  server apache1 apache1:80 check
  server apache2 apache2:80 check
