JkWorkersFile /run/poc/workers.properties
JkLogFile /proc/self/fd/2
JkLogLevel info
<VirtualHost *:80>
  JkMount /* balancer
  JkMount /jk-status status
  <Location /jk-status>
    Require ip 127.0.0.1
  </Location>
  LogFormat "%t %>s %D %{X-Request-ID}i %{JK_LB_FIRST_NAME}n %{JK_LB_LAST_NAME}n" poc
  CustomLog /proc/self/fd/1 poc
</VirtualHost>
