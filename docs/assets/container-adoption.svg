<text x="32" y="393" text-anchor="start" dominant-baseline="middle" font-family="Malgun Gothic,Noto Sans CJK KR,sans-serif" font-size="14" font-weight="400" fill="#52657a">검토 항목을 정리한 그림이며, 투자 규모와 비용을 정량 측정한 결과는 아님</text>
