global
  log stdout format raw local0
defaults
  mode http
  log global
  retries 0
  timeout connect 5s
  timeout client 35s
  timeout server 35s
frontend poc
  bind *:8080
  http-request capture req.hdr(X-Request-ID) len 100
  log-format "POC_HAPROXY id=%[capture.req.hdr(0)] status=%ST server=%s retries=%rc queue_ms=%Tw connect_ms=%Tc response_ms=%Tr active_ms=%Ta"
  default_backend apache
backend apache
  balance roundrobin
  server apache1 apache1:80 check
  server apache2 apache2:80 check
