JkWorkersFile /run/poc/workers.properties
JkLogFile /proc/self/fd/2
JkLogLevel info
<VirtualHost *:80>
  JkMount /* balancer
  JkMount /jk-status status
  <Location /jk-status>
    Require ip 127.0.0.1
  </Location>
  LogFormat "POC_APACHE wall_ms=%{msec}t id=%{X-Request-ID}i status=%>s duration_us=%D first=%{JK_LB_FIRST_NAME}n last=%{JK_LB_LAST_NAME}n first_busy=%{JK_LB_FIRST_BUSY}n last_busy=%{JK_LB_LAST_BUSY}n first_errors=%{JK_LB_FIRST_ERRORS}n last_errors=%{JK_LB_LAST_ERRORS}n" poc
  CustomLog /proc/self/fd/1 poc
</VirtualHost>
